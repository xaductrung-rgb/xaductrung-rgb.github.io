<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Reef Pop</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #03223f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  #wrap { position: relative; margin: 0 auto; }
  canvas { display: block; }
  .ui { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; color: #fff; padding: 18px; overflow-y: auto; touch-action: pan-y; }
  .ui.show { display: flex; }
  .dim { background: rgba(2, 20, 45, 0.78); }
  h1 { font-size: 54px; margin: 34px 0 4px; text-shadow: 0 4px 0 rgba(0,0,0,.35); color: #ffd166; }
  h2 { font-size: 30px; margin: 14px 0 10px; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .sub { color: #bde0fe; margin-bottom: 14px; text-align: center; line-height: 1.5; }
  .btn { border: 0; border-radius: 999px; padding: 14px 26px; margin: 7px; font: 900 22px "Trebuchet MS", sans-serif; color: #fff; background: #06d6a0; box-shadow: 0 5px 0 #059a73; cursor: pointer; min-width: 240px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #059a73; }
  .btn.yellow { background: #ffb703; box-shadow: 0 5px 0 #c98a00; }
  .btn.pink { background: #ef476f; box-shadow: 0 5px 0 #b02a4c; }
  .btn.gray { background: #4a5f80; box-shadow: 0 5px 0 #2f3d55; }
  .btn.small { min-width: 0; padding: 9px 16px; font-size: 16px; }
  .topbar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .pill { background: rgba(0,0,0,.35); border-radius: 999px; padding: 6px 12px; font-weight: 900; font-size: 17px; color: #ffe066; white-space: nowrap; }
  .map { width: 100%; max-width: 380px; display: flex; flex-direction: column-reverse; align-items: center; padding: 20px 0 60px; }
  .node { width: 66px; height: 66px; border-radius: 50%; border: 0; margin: 8px 0; font: 900 22px sans-serif; color: #03223f; background: #ffd166; box-shadow: 0 5px 0 #c98a00; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .node small { font-size: 11px; color: #ef476f; letter-spacing: -1px; }
  .node.locked { background: #4a5f80; box-shadow: 0 5px 0 #2f3d55; color: #9fb3d1; cursor: default; }
  .node.cur { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  .zone { width: 100%; text-align: center; font-weight: 900; color: #bde0fe; margin: 18px 0 4px; font-size: 18px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { border: 0; border-radius: 999px; padding: 8px 14px; font: 900 15px sans-serif; background: rgba(255,255,255,.15); color: #fff; cursor: pointer; }
  .tab.on { background: #ffb703; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 400px; }
  .card { background: rgba(255,255,255,.1); border-radius: 16px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .card .name { font-weight: 900; margin: 4px 0; }
  .card .info { font-size: 12px; color: #bde0fe; min-height: 30px; }
  .card.wide { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; text-align: left; }
  .stars { font-size: 46px; letter-spacing: 6px; margin: 6px 0; color: #ffd166; }
  .toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 900; display: none; z-index: 9; white-space: nowrap; }
  #gameBar { position: absolute; left: 0; right: 0; bottom: 14px; display: none; justify-content: center; gap: 10px; }
  .boost { border: 0; width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.15); font-size: 28px; color: #fff; position: relative; cursor: pointer; }
  .boost.on { background: #ffb703; }
  .boost b { position: absolute; right: -4px; bottom: -4px; background: #ef476f; border-radius: 999px; font-size: 12px; padding: 2px 6px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="scrMenu" class="ui show dim">
    <div class="topbar"><button class="btn small gray" data-go="settings">⚙️</button><span class="pill" data-lives>❤️ 5</span><span class="pill" data-pearls>⚪ 0</span></div>
    <h1>REEF POP</h1>
    <div class="sub">Ghép 3 sinh vật biển giống nhau • Cứu rạn san hô cùng Pengu!</div>
    <canvas id="menuArt" width="220" height="200" style="width:220px;height:200px"></canvas>
    <button class="btn" data-go="map">▶ CHƠI</button>
    <button class="btn pink" data-go="shop">🛒 CỬA HÀNG</button>
  </div>

  <div id="scrMap" class="ui dim">
    <div class="topbar"><button class="btn small gray" data-go="menu">◀</button><span class="pill" data-lives>❤️ 5</span><span class="pill" data-pearls>⚪ 0</span></div>
    <div class="map" id="mapList"></div>
  </div>

  <div id="scrPre" class="ui dim">
    <h2 style="margin-top:50px" id="preTitle">MÀN 1</h2>
    <div class="sub" id="preGoal"></div>
    <div class="sub" style="margin:0 0 6px">Mang theo trợ giúp:</div>
    <div class="grid" id="preItems"></div>
    <button class="btn" id="preStart" style="margin-top:14px">▶ BẮT ĐẦU (❤️ -1)</button>
    <button class="btn small gray" data-go="map">Quay lại</button>
  </div>

  <div id="scrWin" class="ui dim">
    <h2 style="margin-top:70px">TUYỆT VỜI! 🎉</h2>
    <div class="stars" id="winStars">★★★</div>
    <div class="sub" id="winInfo"></div>
    <button class="btn yellow" id="winDouble">▶ XEM QC: x2 NGỌC</button>
    <button class="btn" id="winNext">MÀN TIẾP ▶</button>
    <button class="btn small gray" data-go="map">Bản đồ</button>
  </div>

  <div id="scrLose" class="ui dim">
    <h2 style="margin-top:70px" id="loseTitle">HẾT LƯỢT! 😢</h2>
    <div class="sub" id="loseInfo"></div>
    <button class="btn yellow" id="loseAd">▶ XEM QC: +5 LƯỢT</button>
    <button class="btn pink" id="loseBuy">+5 LƯỢT (⚪ 90)</button>
    <button class="btn gray" id="loseQuit">Bỏ cuộc</button>
  </div>

  <div id="scrNoLives" class="ui dim">
    <h2 style="margin-top:90px">HẾT TIM ❤️</h2>
    <div class="sub" id="nlInfo"></div>
    <button class="btn yellow" id="nlAd">▶ XEM QC: +1 TIM</button>
    <button class="btn pink" id="nlBuy">ĐẦY TIM (⚪ 120)</button>
    <button class="btn small gray" data-go="map">Đợi</button>
  </div>

  <div id="scrShop" class="ui dim">
    <div class="topbar"><button class="btn small gray" data-back>◀</button><span class="pill" data-lives>❤️ 5</span><span class="pill" data-pearls>⚪ 0</span></div>
    <h2 style="margin-top:50px">CỬA HÀNG</h2>
    <div class="tabs"><button class="tab on" data-tab="items">Trợ giúp</button><button class="tab" data-tab="iap">💎 Nạp</button></div>
    <div class="grid" id="shopGrid"></div>
  </div>

  <div id="scrSettings" class="ui dim">
    <div class="topbar"><button class="btn small gray" id="setBack">◀</button><span></span></div>
    <h2 style="margin-top:50px">⚙️ CÀI ĐẶT</h2>
    <div class="grid" id="setGrid" style="grid-template-columns:1fr"></div>
  </div>

  <div id="gameBar">
    <button class="boost" id="bHammer">🔨<b id="cHammer">0</b></button>
    <button class="boost" id="bShuffle">🔄<b id="cShuffle">0</b></button>
    <button class="boost" id="bSet" style="font-size:24px">⚙️</button>
    <button class="boost" id="bPause" style="font-size:22px">II</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
// =====================================================================
//  REEF POP — original match-3 puzzle (levels, goals, boosters, shop, IAP, ads)
// =====================================================================
const W = 420, H = 760;
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), wrap = document.getElementById("wrap");
let scale = 1;
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = devicePixelRatio || 1;
  cv.width = W * scale * dpr; cv.height = H * scale * dpr;
  cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
  wrap.style.width = W * scale + "px"; wrap.style.height = H * scale + "px";
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  document.querySelectorAll(".ui").forEach((u) => (u.style.fontSize = 16 * Math.max(0.8, scale) + "px"));
}
addEventListener("resize", resize); resize();

// ------------------------------------------------------------- SAVE
const SAVE_KEY = "reefpop_save_v1";
const MAX_LIVES = 5, LIFE_MS = 20 * 60 * 1000;
const save = Object.assign({
  pearls: 200, lives: MAX_LIVES, lifeTs: Date.now(), stars: {}, unlocked: 0,
  items: { moves3: 1, startBomb: 1, hammer: 2, shuffle: 2 },
  noAds: false, settings: { sound: true, vibrate: true, diff: "normal" },
}, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}"));
save.settings = Object.assign({ sound: true, music: true, vibrate: true, hint: true, fast: false, diff: "normal" }, save.settings || {});
function persist() { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); refreshTop(); }
function tickLives() {
  if (save.lives >= MAX_LIVES) { save.lifeTs = Date.now(); return; }
  const n = Math.floor((Date.now() - save.lifeTs) / LIFE_MS);
  if (n > 0) { save.lives = Math.min(MAX_LIVES, save.lives + n); save.lifeTs += n * LIFE_MS; persist(); }
}
function lifeTimer() {
  if (save.lives >= MAX_LIVES) return "ĐẦY";
  const ms = LIFE_MS - (Date.now() - save.lifeTs), m = Math.max(0, Math.floor(ms / 60000)), s = Math.max(0, Math.floor((ms % 60000) / 1000));
  return `${m}:${String(s).padStart(2, "0")}`;
}
function refreshTop() {
  document.querySelectorAll("[data-pearls]").forEach((e) => (e.textContent = "⚪ " + save.pearls));
  document.querySelectorAll("[data-lives]").forEach((e) => (e.textContent = `❤️ ${save.lives}` + (save.lives < MAX_LIVES ? ` ${lifeTimer()}` : "")));
}
setInterval(() => { tickLives(); refreshTop(); if (scr === "nolives") document.getElementById("nlInfo").textContent = `Tim tiếp theo sau ${lifeTimer()}`; }, 1000);
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 1800); }

const DIFFS = {
  easy: { name: "Dễ", icon: "🙂", moves: 5, colors: -1, reward: 0.7 },
  normal: { name: "Thường", icon: "😎", moves: 0, colors: 0, reward: 1 },
  hard: { name: "Khó", icon: "😤", moves: -4, colors: 0, reward: 1.5 },
  expert: { name: "Chuyên gia", icon: "💀", moves: -7, colors: 1, reward: 2 },
};
const D = () => DIFFS[save.settings.diff] || DIFFS.normal;
function vibrate(ms) { if (save.settings.vibrate && navigator.vibrate) navigator.vibrate(ms); }

// ------------------------------------------------------------- AUDIO
let ac = null;
function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; }
function tone(f0, f1, dur, type = "sine", vol = 0.15, delay = 0) {
  if (!save.settings.sound) return;
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur);
}
const sfx = {
  swap: () => tone(500, 700, 0.08, "sine", 0.1),
  bad: () => { tone(300, 200, 0.12, "square", 0.06); tone(250, 160, 0.12, "square", 0.06, 0.1); },
  pop: (chain) => { const f = 500 * Math.pow(1.12, Math.min(chain, 10)); tone(f, f * 1.6, 0.12, "triangle", 0.14); },
  special: () => { tone(200, 1200, 0.3, "sawtooth", 0.07); tone(900, 1800, 0.25, "sine", 0.1, 0.05); },
  boom: () => { tone(150, 40, 0.4, "sine", 0.3); tone(800, 100, 0.3, "sawtooth", 0.06); },
  win: () => [523, 659, 784, 1047, 1319].forEach((n, i) => tone(n, n, 0.3, "triangle", 0.16, i * 0.11)),
  lose: () => [392, 330, 262].forEach((n, i) => tone(n, n * 0.98, 0.35, "triangle", 0.14, i * 0.18)),
  buy: () => { tone(800, 1600, 0.15, "square", 0.07); tone(1200, 2400, 0.2, "square", 0.07, 0.1); },
};

// ------------------------------------------------------------- PIECES (original sea critters)
const COLORS = [
  { name: "Cua", c: "#ef476f", d: "#b02a4c" },
  { name: "Cá", c: "#ff9f1c", d: "#c76e00" },
  { name: "Sao biển", c: "#ffd166", d: "#c99a1e" },
  { name: "Rùa", c: "#06d6a0", d: "#03956e" },
  { name: "Sứa", c: "#4cc9f0", d: "#1f8db3" },
  { name: "Ốc", c: "#b388eb", d: "#7b4fbf" },
];
// ---------- Glossy pseudo-3D rendering (pre-rendered sprites + live special FX) ----------
function shadeEllipse(g, x, y, rx, ry, base, dark, light) {
  const gr = g.createRadialGradient(x - rx * 0.35, y - ry * 0.45, Math.min(rx, ry) * 0.1, x, y, Math.max(rx, ry) * 1.1);
  gr.addColorStop(0, light); gr.addColorStop(0.45, base); gr.addColorStop(1, dark);
  g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill();
}
function shadePath(g, pathFn, cx, cy, r, base, dark, light) {
  const gr = g.createRadialGradient(cx - r * 0.35, cy - r * 0.45, r * 0.1, cx, cy, r * 1.15);
  gr.addColorStop(0, light); gr.addColorStop(0.5, base); gr.addColorStop(1, dark);
  g.fillStyle = gr; g.beginPath(); pathFn(); g.fill();
}
function gloss(g, x, y, rx, ry, a = 0.6) {
  const gr = g.createLinearGradient(x, y - ry, x, y + ry);
  gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rx, ry, -0.3, 0, 7); g.fill();
}
function eye3d(g, x, y, r) {
  shadeEllipse(g, x, y, r, r * 1.08, "#f1f5f9", "#94a3b8", "#ffffff");
  g.fillStyle = "#1b1b2f"; g.beginPath(); g.arc(x + r * 0.18, y + r * 0.2, r * 0.55, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(x - r * 0.05, y - r * 0.05, r * 0.22, 0, 7); g.fill();
}
function smile(g, x, y, w, color) { g.strokeStyle = color; g.lineWidth = 1.8; g.lineCap = "round"; g.beginPath(); g.arc(x, y, w, 0.2, Math.PI - 0.2); g.stroke(); }
function blush(g, x, y) { g.fillStyle = "rgba(255,120,150,.45)"; g.beginPath(); g.ellipse(x, y, 3.5, 2, 0, 0, 7); g.fill(); }

const PAL = [
  { base: "#ff4d6d", dark: "#a4133c", light: "#ffc2d1" }, // crab
  { base: "#ff9f1c", dark: "#c2410c", light: "#ffe0b3" }, // fish
  { base: "#ffd60a", dark: "#b08900", light: "#fff7c2" }, // starfish
  { base: "#2ec4b6", dark: "#0b6e63", light: "#c6f7f0" }, // turtle
  { base: "#4cc9f0", dark: "#1d6fa5", light: "#e3f8ff" }, // jelly
  { base: "#b388eb", dark: "#5a2a8a", light: "#efe0ff" }, // shell
];
function paintCritter(g, t) {
  const p = PAL[t];
  g.save();
  g.shadowColor = "rgba(0,20,40,.45)"; g.shadowBlur = 6; g.shadowOffsetY = 4;
  if (t === 0) { // CRAB
    g.strokeStyle = p.dark; g.lineWidth = 2.5; g.lineCap = "round";
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(s * 10, 6 + i * 4); g.lineTo(s * 19, 9 + i * 5); g.stroke(); }
    for (const s of [-1, 1]) { shadeEllipse(g, s * 17, -7, 7.5, 6.5, p.base, p.dark, p.light); }
    shadeEllipse(g, 0, 4, 16, 12, p.base, p.dark, p.light);
    g.shadowColor = "transparent";
    g.fillStyle = p.dark; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 20, -13); g.lineTo(s * 16, -7); g.lineTo(s * 23, -9); g.fill(); }
    g.strokeStyle = p.dark; g.lineWidth = 2; for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 4, -5); g.lineTo(s * 6, -11); g.stroke(); }
    gloss(g, -4, -1, 9, 4.5);
    eye3d(g, -6, -13, 4.6); eye3d(g, 6, -13, 4.6);
    smile(g, 0, 4, 4, p.dark); blush(g, -9, 6); blush(g, 9, 6);
  } else if (t === 1) { // FISH
    shadePath(g, () => { g.moveTo(9, 0); g.quadraticCurveTo(18, -14, 23, -11); g.quadraticCurveTo(19, 0, 23, 11); g.quadraticCurveTo(18, 14, 9, 0); }, 16, 0, 10, p.base, p.dark, p.light);
    shadePath(g, () => { g.moveTo(-8, -11); g.quadraticCurveTo(0, -20, 7, -10); g.closePath(); }, 0, -13, 6, p.base, p.dark, p.light);
    shadeEllipse(g, -2, 0, 15, 13, p.base, p.dark, p.light);
    g.shadowColor = "transparent";
    g.save(); g.beginPath(); g.ellipse(-2, 0, 15, 13, 0, 0, 7); g.clip();
    for (const bx of [2, -12]) { const gr = g.createLinearGradient(bx - 3, 0, bx + 3, 0); gr.addColorStop(0, "#e2e8f0"); gr.addColorStop(0.5, "#ffffff"); gr.addColorStop(1, "#cbd5e1"); g.fillStyle = gr; g.beginPath(); g.ellipse(bx, 0, 3.2, 14, 0, 0, 7); g.fill(); g.strokeStyle = "rgba(60,20,0,.35)"; g.lineWidth = 1; g.stroke(); }
    g.restore();
    gloss(g, -5, -6, 9, 4);
    eye3d(g, -8, -3, 5); smile(g, -12, 4, 2.5, p.dark);
  } else if (t === 2) { // STARFISH
    const star = () => { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, r = i % 2 ? 9 : 20; const fn = i ? g.lineTo : g.moveTo; fn.call(g, Math.cos(a) * r, Math.sin(a) * r + 2); } g.closePath(); };
    g.lineJoin = "round"; shadePath(g, star, 0, 2, 20, p.base, p.dark, p.light);
    g.shadowColor = "transparent";
    g.strokeStyle = p.dark; g.lineWidth = 1.5; g.beginPath(); star(); g.stroke();
    g.fillStyle = "rgba(255,255,255,.55)"; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; g.beginPath(); g.arc(Math.cos(a) * 13, Math.sin(a) * 13 + 2, 1.6, 0, 7); g.fill(); }
    gloss(g, -3, -4, 7, 3.5);
    eye3d(g, -4.5, 0, 3.6); eye3d(g, 4.5, 0, 3.6); smile(g, 0, 5, 3, p.dark);
  } else if (t === 3) { // TURTLE
    for (const [fx, fy] of [[-15, -6], [15, -6], [-14, 12], [14, 12]]) shadeEllipse(g, fx, fy, 5.5, 4, "#80ed99", "#2d6a4f", "#d8f3dc");
    shadeEllipse(g, 0, -15, 7, 6.5, "#80ed99", "#2d6a4f", "#d8f3dc");
    shadeEllipse(g, 0, 4, 16, 13, p.base, p.dark, p.light);
    g.shadowColor = "transparent";
    g.strokeStyle = "rgba(5,60,50,.55)"; g.lineWidth = 1.6;
    g.beginPath(); for (let i = 0; i < 6; i++) { const a = (i * Math.PI) / 3 + Math.PI / 6; const fn = i ? g.lineTo : g.moveTo; fn.call(g, Math.cos(a) * 6.5, Math.sin(a) * 5.5 + 4); } g.closePath(); g.stroke();
    for (let i = 0; i < 6; i++) { const a = (i * Math.PI) / 3 + Math.PI / 6; g.beginPath(); g.moveTo(Math.cos(a) * 6.5, Math.sin(a) * 5.5 + 4); g.lineTo(Math.cos(a) * 15, Math.sin(a) * 12 + 4); g.stroke(); }
    gloss(g, -4, -2, 9, 4.5);
    eye3d(g, -3, -16, 2.6); eye3d(g, 3, -16, 2.6);
  } else if (t === 4) { // JELLYFISH
    g.lineCap = "round";
    for (let i = -2; i <= 2; i++) { g.strokeStyle = i % 2 ? "rgba(76,201,240,.85)" : "rgba(160,230,255,.9)"; g.lineWidth = 3; g.beginPath(); g.moveTo(i * 5.5, 4); g.bezierCurveTo(i * 5.5 + 4, 9, i * 5.5 - 4, 14, i * 5.5 + 1, 21); g.stroke(); }
